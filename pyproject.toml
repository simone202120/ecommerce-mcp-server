[project]
name = "ecommerce-mcp-server"
version = "0.1.0"
description = "MCP server exposing safe, read-only tools over an e-commerce PostgreSQL database (with pgvector semantic product search), plus a LangGraph agent that uses it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "deptry>=0.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm'"
markers = [
    "integration: needs real infrastructure (docker compose services)",
    "llm: calls a real LLM through OpenRouter (manual only)",
]

[tool.coverage.run]
source = ["src/ecommerce_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["ecommerce_mcp"]
